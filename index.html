<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow - Repostajes</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;   /* Centrado horizontal */
            align-items: center;       /* Centrado vertical */
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .wrapper {
            display: flex;
            gap: 40px;                 /* Separación entre bloques */
            align-items: flex-start;   /* Alineación superior */
        }

        .bloque {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 300px;
        }

        h2 {
            margin-top: 0;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #ff7b00;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #e56f00;
        }

        .resumen-item {
            margin: 10px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- Bloque del formulario -->
        <div class="bloque">
            <h2>Añadir repostaje</h2>

            <label>Fecha</label>
            <input type="text" placeholder="22/02/2026">

            <label>Gasolinera</label>
            <input type="text" placeholder="Repsol">

            <label>Gasto (€)</label>
            <input type="text" placeholder="Ej. 20.00 o 20,00">

            <button>Añadir repostaje</button>
        </div>

        <!-- Bloque del resumen -->
        <div class="bloque">
            <h2>Resumen</h2>

            <div class="resumen-item">Mes actual: <strong>0.00 €</strong></div>
            <div class="resumen-item">Año actual: <strong>69.00 €</strong></div>
            <div class="resumen-item">Nº repostajes: <strong>3</strong></div>
            <div class="resumen-item">Media por repostaje: <strong>23.00 €</strong></div>

            <label>Mes</label>
            <select>
                <option>Febrero</option>
            </select>

            <label>Año</label>
            <select>
                <option>2026</option>
            </select>
        </div>

    </div>

</body>
</html>
