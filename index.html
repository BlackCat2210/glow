<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GLOW | Gasolina</title>

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --muted: #3b3b3b;
      --accent: #00e5ff;
      --accent-dark: #0083cc;
    }

    body.light {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #121212;
      --muted: #555555;
      --accent: #0077ff;
      --accent-dark: #005fcc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
      overscroll-behavior-y: none;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    .container { width: 100%; max-width: 480px; }
    h1 { text-align: center; color: var(--accent); text-shadow: 0 0 10px var(--accent); margin-bottom: 10px; font-size: 2.5em; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 0.9em; }
    .card { background: var(--card); padding: 20px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); margin-bottom: 20px; }
    .card:hover { transform: translateY(-4px); }
    label { display: block; margin-top: 10px; font-size: 1.05em; color: var(--muted); }
    input, select { width: 100%; padding: 12px; margin-top: 6px; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 8px; }
    body.light input, body.light select {
      background: #f0f0f0;
      border-color: #ccc;
      color: #121212;
    }

    button { width: 100%; padding: 14px; margin-top: 18px; background: var(--accent); color: #121212; border: none; border-radius: 12px; font-weight: bold; }
    button:active { transform: scale(0.97); background: var(--accent-dark); }

    .btn-secondary { background: #2d2d2d; color: var(--accent); margin-top: 10px; border: 1px solid #444; }
    body.light .btn-secondary { background: #ffffff; border-color: #ddd; }

    .history-item { background: #2d2d2d; padding: 12px; border-radius: 12px; margin-top: 10px; display: flex; justify-content: space-between; }
    body.light .history-item { background: #ffffff; }

    .delete-btn { background: #ff4444; color: white; border: none; border-radius: 8px; padding: 8px 10px; width: auto; font-size: 1em; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    .stat-item { background: #2d2d2d; border-radius: 12px; padding: 10px; text-align: center; font-size: 0.9em; color: var(--muted); }
    body.light .stat-item { background: #f0f0f0; }

    .stat-value { display: block; margin-top: 4px; font-size: 1.2em; color: var(--accent); font-weight: bold; }

    canvas { max-width: 100%; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

    .theme-toggle { width: auto; padding: 8px 12px; font-size: 0.85em; margin-top: 0; }
  </style>
</head>

<body>

  <!-- Splash -->
  <div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#121212;color:white;display:flex;justify-content:center;align-items:center;font-size:2em;z-index:9999;">
    Cargando...
  </div>

  <!-- App -->
  <div id="appRoot" style="display:none;" class="container">

    <h1>GLOW</h1>
    <p class="subtitle">Control de gasolina</p>

    <div class="card">
      <label>Litros</label>
      <input id="litros" type="number">

      <label>Precio</label>
      <input id="precio" type="number">

      <label>Kilómetros</label>
      <input id="km" type="number">

      <button onclick="saveEntry()">Guardar</button>
    </div>

    <h2>Historial</h2>
    <div id="history"></div>

  </div>

  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('appRoot').style.display = 'block';
      }, 500);
    });
  </script>

</body>
</html>
